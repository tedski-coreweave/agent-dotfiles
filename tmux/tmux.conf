# Terminal
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:RGB:extkeys"
set -g extended-keys-format csi-u

# Session behavior
set -g history-limit 100000
set -g focus-events on
set -g status-position top
set -g status-style bg=colour25,fg=white
set -g window-status-current-style fg=grey,bold

# Prefix
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
set -g pane-border-style fg=color240
set -g pane-active-border-style fg=color39
set -g mouse on

# Windows
bind-key c new-window -c "#{pane_current_path}"
bind-key Tab last-window
setw -g automatic-rename off

# Copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Configuration
bind-key r source-file ~/.tmux.conf\; display-message "tmux config reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tpm/tpm'
