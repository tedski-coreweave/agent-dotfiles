repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Focused local checks. Deliberately small: this is a config repo, not an
  # application. ./verify.sh runs these plus the install check in one shot.
  - repo: local
    hooks:
      - id: shell-syntax
        name: shell syntax
        entry: bash -n
        language: system
        files: \.(sh|zsh)$

      - id: tracked-json
        name: tracked json
        entry: jq empty
        language: system
        files: \.json$
        exclude: ^pi/agent/npm/package-lock\.json$

      - id: extension-typecheck
        name: extension typecheck
        entry: npm run --silent check:extensions
        language: system
        pass_filenames: false
        files: ^(pi/agent/extensions/.*\.ts|tsconfig\.extensions\.json)$

      - id: skill-checks
        name: skill checks
        entry: node scripts/check-skills.mjs
        language: system
        pass_filenames: false
        files: ^(skills/|scripts/check-skills\.mjs|CREDITS\.md)

      - id: codeowners-tests
        name: codeowners tests
        entry: ./scripts/test-codeowners.sh
        language: system
        pass_filenames: false
        files: ^pi/agent/extensions/codeowners/
